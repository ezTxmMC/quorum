[package]
name = "quorum-desktop"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "quorum-native"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1"
serde_json = "1"
quorum-core = { path = "../quorum-core" }

# GPUI 0.2.2 pulls xattr 0.2.3 via zed-async-tar. libc removed Linux ENOATTR.
[patch.crates-io]
xattr = { path = "vendor/xattr" }

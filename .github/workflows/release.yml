name: Release & Dev Pipeline

on:
  push:
    branches:
      - master
      - main
    tags:
      - '1.0.0-dev.*'
      - '1.0.0-beta.*'
      - '1.0.0-release.*'
      - 'v1.0.0-*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release-Kanal'
        required: true
        default: 'dev'
        type: choice
        options:
          - 'dev'
          - 'beta'
          - 'release'

permissions:
  contents: write

# Serialize publishing and cleanup, including manual and tag-triggered runs.
# Do not interrupt an upload and leave the previous usable release removed.
concurrency:
  group: quorum-releases
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      channel: ${{ steps.meta.outputs.channel }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      title: ${{ steps.meta.outputs.title }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Determine Tag, Channel & Release Info
        id: meta
        run: |
          set -e
          REF_NAME="${GITHUB_REF_NAME}"
          EVENT="${GITHUB_EVENT_NAME}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            CHANNEL="${{ inputs.channel }}"
            TAG=$(node scripts/release.ts next "$CHANNEL")
          elif [ "$EVENT" = "push" ] && [[ "$GITHUB_REF" =~ ^refs/tags/ ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" =~ -dev\. ]]; then
              CHANNEL="dev"
            elif [[ "$TAG" =~ -beta\. ]]; then
              CHANNEL="beta"
            elif [[ "$TAG" =~ -release\. ]]; then
              CHANNEL="release"
            else
              CHANNEL="release"
            fi
          else
            # Push auf master/main -> Dev-Channel (jeder erfolgreiche Commit: 1.0.0-dev.<8-commit-chars>)
            CHANNEL="dev"
            TAG=$(node scripts/release.ts next dev)
          fi

          IS_PRERELEASE="false"
          if [ "$CHANNEL" = "dev" ] || [ "$CHANNEL" = "beta" ]; then
            IS_PRERELEASE="true"
          fi

          if [ "$CHANNEL" = "dev" ]; then
            TITLE="Quorum Dev (${TAG#1.0.0-dev.})"
          elif [ "$CHANNEL" = "beta" ]; then
            TITLE="Quorum Beta ${TAG#1.0.0-beta.}"
          else
            TITLE="Quorum Release ${TAG#1.0.0-release.}"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT

          echo "==> Target Tag: $TAG"
          echo "==> Channel: $CHANNEL"
          echo "==> Prerelease: $IS_PRERELEASE"
          echo "==> Title: $TITLE"

  # The native chat host must be compiled on its target platform, so every OS builds its own packages.
  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            package: --linux AppImage deb --x64
            optional: false
          - name: windows-x64
            os: windows-latest
            package: --win nsis zip --x64
            optional: true
          - name: macos-arm64
            os: macos-26
            package: --mac dmg zip --arm64
            optional: true
    runs-on: ${{ matrix.os }}
    # Windows and macOS packages are new: a failure there must not block the Linux release.
    continue-on-error: ${{ matrix.optional }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Update package.json version
        run: |
          npm version "${{ needs.meta.outputs.tag }}" --no-git-tag-version

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Icons & Assets
        run: |
          npm run icons

      - name: Build Web & Electron
        run: |
          npm run build

      - name: Verify Plan and IDE Core
        if: runner.os == 'Linux'
        run: |
          npm run test:plan-core
          npm run test:plan-cli
          npm run test:lsp-core
          npm run test:lsp-servers
          npm run test:workspace-search
          npm run test:chat-host
          npm run test:chat-recovery
          npm run test:chat-manager
          npm run test:chat-provider-worker
          npm run test:chat-lifecycle
          npm run test:chat-persistence
          npm run test:chat-runtime
          cargo fmt --manifest-path native/chat-host/Cargo.toml --check
          cargo clippy --manifest-path native/chat-host/Cargo.toml --all-targets -- -D warnings

      - name: Build Packages
        run: |
          npx electron-builder ${{ matrix.package }} --publish never

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 3
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip

  publish:
    needs: [meta, build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Packages
        uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: release

      - name: Generate Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_ARG=""
          if [ "${{ needs.meta.outputs.is_prerelease }}" = "true" ]; then
            PR_ARG="--prerelease"
          fi

          TAG="${{ needs.meta.outputs.tag }}"
          TITLE="${{ needs.meta.outputs.title }}"

          # Release erstellen oder Assets hochladen falls Release existiert
          gh release create "$TAG" \
            release/* \
            --title "$TITLE" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            $PR_ARG || \
          gh release upload "$TAG" \
            release/* \
            --clobber

      - name: Retain only the published dev release
        if: needs.meta.outputs.channel == 'dev'
        uses: actions/github-script@v7
        env:
          KEEP_DEV_TAG: ${{ needs.meta.outputs.tag }}
        with:
          script: |
            const { pruneDevReleases } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/prune-dev-releases.mjs`);
            await pruneDevReleases(github, context.repo, process.env.KEEP_DEV_TAG);

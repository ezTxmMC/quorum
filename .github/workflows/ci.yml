name: Quorum CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'rustfmt, clippy' }
      - uses: biomejs/setup-biome@v2
        with: { version: '2.3.13' }
      - run: npm ci
      - run: npm run lint && npm run typecheck
      - run: npm test && npm run test:integration
      - run: npm run build
      - run: xvfb-run -a npm run test:ide-ui
      - run: |
          for crate in native/chat-host native/quorum-core; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --check
            cargo clippy --locked --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
            cargo test --locked --manifest-path "$crate/Cargo.toml"
          done
  tauri:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-24.04, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - run: npm run build:tauri-assets && npm run build:web
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo build --release --manifest-path src-tauri/Cargo.toml --features custom-protocol
